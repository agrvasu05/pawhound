name: Daily digital products

on:
  schedule:
    # 01:30 UTC: posting lands ~9:40 PM ET — staggered ~40 min after the content
    # run so the ~15 pins spread across the 8-11 PM ET evening peak, not all at once.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Gumroad CLI
        run: go install github.com/antiwork/gumroad-cli/cmd/gumroad@latest

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install dependencies
        run: npm install

      # 0) Refresh trending keywords/topics (content/trend-briefs.json)
      - name: Refresh Pinterest trend briefs
        run: node products/trends-engine.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      # 1) Create products + owned landing pages + queue pin variants (no posting yet)
      - name: Generate products + landing pages
        run: node products/generate-daily.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          HOME: /home/runner

      # 2) Deploy landing pages FIRST so Pinterest links resolve + Rich Pins enrich
      - name: Commit landing pages + queue
        run: |
          git config user.name "PawHound Bot"
          git config user.email "bot@valuefindsdaily.com"
          git add content/shop public/shop-assets content/pin-queue.json content/gumroad-products.json content/trend-briefs.json
          git diff --cached --quiet || git commit -m "Daily products + landing pages"
          git push

      - name: Wait for Netlify deploy
        run: sleep 300

      # 3) Drip-post pin variants to Pinterest, linking to the owned landing pages
      - name: Post pin variants
        run: node products/post-queue.js --max=5
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      - name: Commit updated pin queue
        run: |
          git add content/pin-queue.json
          git diff --cached --quiet || git commit -m "Update pin queue"
          git push
