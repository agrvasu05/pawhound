name: Daily digital products

on:
  schedule:
    # 15:00 UTC = ~11 AM ET. GENERATION ONLY — creates products + landing pages and
    # queues pin variants during the day. The queued pins are POSTED separately in
    # post-pins.yml at 9 PM ET (cron-job.org trigger), so exact timing here is moot.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # required for keyless Google Cloud auth (Workload Identity)

jobs:
  products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Keyless auth to Google Cloud for Vertex AI (Gemini).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: project-394cd8b9-b7dd-48a6-930
          workload_identity_provider: projects/1010009979038/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: vertex-gemini@project-394cd8b9-b7dd-48a6-930.iam.gserviceaccount.com

      - name: Install Gumroad CLI
        run: go install github.com/antiwork/gumroad-cli/cmd/gumroad@latest

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install dependencies
        run: npm install

      # 0) Refresh trending keywords/topics (content/trend-briefs.json)
      - name: Refresh Pinterest trend briefs
        run: node products/trends-engine.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCP_PROJECT_ID: project-394cd8b9-b7dd-48a6-930
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      # 1) Create products + owned landing pages + queue pin variants (no posting yet)
      - name: Generate products + landing pages
        run: node products/generate-daily.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCP_PROJECT_ID: project-394cd8b9-b7dd-48a6-930
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          HOME: /home/runner

      # 1b) Keep "free printable" funnel pins flowing (playbook rule 9). Self-
      # limiting: only enqueues when no freebie variants are pending; postQueue's
      # 7-day spacing drips them ~1/week. Most days this is a no-op.
      - name: Queue freebie funnel pins
        run: node products/freebie-pins.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCP_PROJECT_ID: project-394cd8b9-b7dd-48a6-930

      # 2) Deploy landing pages + queue so links resolve + Rich Pins enrich long
      # before the evening posting run (post-pins.yml). No posting happens here.
      - name: Commit landing pages + queue
        run: |
          git config user.name "PawHound Bot"
          git config user.email "bot@valuefindsdaily.com"
          git add content/shop public/shop-assets content/pin-queue.json content/gumroad-products.json content/trend-briefs.json
          git diff --cached --quiet || git commit -m "Daily products + landing pages"
          git pull --rebase --autostash || true
          git push
