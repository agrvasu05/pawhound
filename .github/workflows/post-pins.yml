name: Post pins (US peak windows)

# Posting is DECOUPLED from generation. Content + products are generated earlier
# in the day (daily-content.yml / daily-products.yml) and are live on the site
# by now. This workflow ONLY posts: it renders each pin at post time (nothing is
# committed to public/pins any more) and uploads it as base64.
#
# Cadence (Oct 2026 reset): two runs a day, every day, inside Pinterest's US
# peak windows — midday (10 AM–1 PM ET) and evening (6–11 PM ET). Each run posts
# up to 3 content pins + 2 product pins, so a full day is 6–10 fresh pins: the
# audit target, and still under the 10/day spam line.
#
# 11 Oct 2026: GitHub started scheduled runs 4–6 hours late, so every run landed
# outside the old 3-hour windows and nothing posted for a day and a half. The job
# is now triggered hourly and the windows are wide (midday 9 AM–4 PM ET, evening
# 5–11 PM ET). The once-per-window stamp below still caps it at two posting runs
# a day; the extra runs exit in seconds (free on a public repo).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'    # hourly; the guard picks the window and dedupes

permissions:
  contents: write

concurrency:
  group: post-pins
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # ref: main fetches the branch tip when the step runs (not the SHA at
      # trigger time), so a run queued behind another sees its window stamp.
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      # Safety guard: only post during peak windows. Each window also posts at
      # most once per day (a stamp file in content/.post-stamps), so the backup
      # cron never double-posts when the primary already ran.
      - name: Guard — peak window + once per window per day
        id: guard
        run: |
          H=$(TZ=America/New_York date +%H)
          D=$(TZ=America/New_York date +%F)
          WINDOW=""
          if [ "$H" -ge 9 ] && [ "$H" -le 16 ]; then WINDOW=midday; fi
          if [ "$H" -ge 17 ] && [ "$H" -le 23 ]; then WINDOW=evening; fi
          echo "Eastern hour: $H  window: ${WINDOW:-none}"
          if [ -z "$WINDOW" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Outside peak windows — skipping."; exit 0
          fi
          STAMP="content/.post-stamps/$D-${WINDOW:-manual}"
          if [ -f "$STAMP" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "Window already posted today ($STAMP) — skipping."; exit 0
          fi
          # The stamp itself is written by "Claim window" below, after setup has
          # succeeded, so a failed setup leaves the window free for the next hourly run.
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: '20'

      # 13 Nov 2026: `apt-get install chromium-browser` (a snap wrapper) failed three
      # windows in a row when the snap store / apt mirror was unreachable. Use the
      # browser already on the runner image and only fall back to apt (with retries).
      - name: Find a browser for Puppeteer
        if: steps.guard.outputs.ok == 'true'
        run: |
          find_browser() {
            for b in google-chrome google-chrome-stable chromium-browser chromium; do
              if command -v "$b" >/dev/null 2>&1; then command -v "$b"; return 0; fi
            done
            return 1
          }
          BROWSER=$(find_browser || true)
          if [ -z "$BROWSER" ]; then
            for i in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y chromium-browser; then break; fi
              echo "apt attempt $i failed; retrying in 20s"; sleep 20
            done
            BROWSER=$(find_browser || true)
          fi
          if [ -z "$BROWSER" ]; then echo "No browser available for Puppeteer"; exit 1; fi
          echo "Using browser: $BROWSER"
          "$BROWSER" --version || true
          echo "PUPPETEER_EXECUTABLE_PATH=$BROWSER" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.guard.outputs.ok == 'true'
        run: npm install

      - name: Sync latest content
        if: steps.guard.outputs.ok == 'true'
        run: git pull --rebase --autostash || { node products/merge-queue.js && GIT_EDITOR=true git rebase --continue; }

      # Setup worked: claim this window now (once per window per day).
      - name: Claim window
        if: steps.guard.outputs.ok == 'true'
        run: |
          mkdir -p content/.post-stamps && touch "${{ steps.guard.outputs.stamp }}"
          # keep only the last 14 days of stamps
          ls -1 content/.post-stamps | sort | head -n -40 | sed 's#^#content/.post-stamps/#' | xargs -r rm -f

      # 1) Content (article) pins — rendered at post time, up to 3/run, ≤1 dog guide
      - name: Post content pins
        id: pinterest
        if: steps.guard.outputs.ok == 'true'
        run: node scripts/5-post-pins.js --max=2   # 2 per window while the dog-only account rebuilds (Oct 2026)
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      # Rotate the Pinterest refresh token if the poster returned a new one.
      # PINTEREST_PAT must be a GitHub token with repo scope (see OPERATIONS.md);
      # if it has expired the new refresh token is lost and auth dies next run.
      - name: Rotate Pinterest refresh token
        if: steps.guard.outputs.ok == 'true' && steps.pinterest.outputs.new_refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.PINTEREST_PAT }}
        run: |
          gh secret set PINTEREST_REFRESH_TOKEN --body "${{ steps.pinterest.outputs.new_refresh_token }}" --repo ${{ github.repository }}

      # 2) Product (shop landing page) pin variants — 2 per run, 7-day spacing per product
      - name: Post product pins
        if: steps.guard.outputs.ok == 'true'
        run: node products/post-queue.js --max=2
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      # 3) Board hygiene: delete EMPTY off-niche boards only (never ones with pins)
      - name: Board hygiene
        if: steps.guard.outputs.ok == 'true'
        continue-on-error: true
        run: node products/board-hygiene.js
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      - name: Commit trackers
        if: always() && steps.guard.outputs.ok == 'true'
        run: |
          git config user.name "PawHound Bot"
          git config user.email "bot@valuefindsdaily.com"
          git add content/posted-pins.json content/pinterest-boards.json content/pin-queue.json content/.post-stamps
          git diff --cached --quiet || git commit -m "Update pin trackers [skip netlify] [CI Skip]"
          # 13 Nov 2026: a one-off GitHub "Internal Server Error" on push failed a run;
          # retry so posted-pin records aren't lost.
          for i in 1 2 3; do
            git pull --rebase --autostash || { node products/merge-queue.js && GIT_EDITOR=true git rebase --continue; }
            if git push; then exit 0; fi
            echo "push attempt $i failed; retrying in 15s"; sleep 15
          done
          exit 1
