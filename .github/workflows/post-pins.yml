name: Post pins (US peak windows)

# Posting is DECOUPLED from generation. Content + products are generated earlier
# in the day (see daily-content.yml / daily-products.yml) and are already live on
# the site by now. This workflow ONLY posts the already-queued pins.
#
# Two triggers, two peak windows (guard enforces both):
#   • EVENING (daily): cron-job.org fires workflow_dispatch at 01:00 UTC
#     = 9 PM ET. External scheduler because GitHub's `schedule:` events get
#     delayed by hours near midnight UTC, and this window needs precision.
#   • MIDDAY (Tue-Thu): GitHub's own schedule below, targeting the 10 AM-1 PM ET
#     peak. Precision doesn't matter here — the run lands anywhere in a 3-hour
#     window, and if GitHub delays it past 1 PM ET the guard just skips (the
#     evening run still posts that day). No external account needed.
#
# Per-run caps keep the two runs within the 3-5 fresh pins/day playbook target:
# 2 content + up to 1 product per run, and postQueue's DAILY product cap means
# the second run never double-posts products.

on:
  workflow_dispatch:   # fired by cron-job.org at 01:00 UTC (and manual button)
  schedule:
    - cron: '5 15 * * 2,3,4'   # Tue-Thu ~15:05 UTC = 11:05 AM EDT / 10:05 AM EST

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Safety guard: only post during Pinterest's US peak windows — evening
      # (6-11 PM ET) and midday (10 AM-1 PM ET, per content/pinterest-playbook-2026.md
      # rule 6). To activate the midday slot, add a SECOND cron-job.org trigger at
      # ~15:00 UTC; pins then spread across two slots instead of one evening dump.
      # If something fires off-schedule, we SKIP rather than post at a bad hour.
      - name: Guard — only post in peak windows (10 AM-1 PM / 6-11 PM ET)
        id: guard
        run: |
          H=$(TZ=America/New_York date +%H)
          echo "Eastern hour: $H"
          if { [ "$H" -ge 18 ] && [ "$H" -le 23 ]; } || { [ "$H" -ge 10 ] && [ "$H" -le 12 ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Outside peak windows — skipping this run."
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ok == 'true'
        with:
          node-version: '20'

      - name: Install Puppeteer system dependencies
        if: steps.guard.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install dependencies
        if: steps.guard.outputs.ok == 'true'
        run: npm install

      # Pull any commits the daytime generation runs pushed, so we post the
      # freshest queue/content.
      - name: Sync latest content
        if: steps.guard.outputs.ok == 'true'
        run: git pull --rebase --autostash || true

      # 1) Post article/content pins (up to 10/run; skips dog articles internally)
      - name: Post content pins
        id: pinterest
        if: steps.guard.outputs.ok == 'true'
        run: node scripts/5-post-pins.js
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}

      # Rotate the Pinterest refresh token if the poster returned a new one
      - name: Rotate Pinterest refresh token
        if: steps.guard.outputs.ok == 'true' && steps.pinterest.outputs.new_refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.PINTEREST_PAT }}
        run: |
          gh secret set PINTEREST_REFRESH_TOKEN --body "${{ steps.pinterest.outputs.new_refresh_token }}" --repo ${{ github.repository }}

      # 2) Drip-post product (shop landing page) pin variants (1/run while the
      #    account is young; 2 content + 1 product = ~3/day, ~21/week)
      - name: Post product pins
        if: steps.guard.outputs.ok == 'true'
        run: node products/post-queue.js --max=1
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      # 3) Niche lockdown (playbook rule 5): secret up to 4 off-niche boards per
      #    day — ~90 legacy dog/beauty/fashion boards clear in ~3 weeks, staggered
      #    so the cleanup never looks like mass edits. No-op once they're gone.
      - name: Board hygiene — secret off-niche boards
        if: steps.guard.outputs.ok == 'true'
        run: node products/board-hygiene.js
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      # Save updated trackers (posted-pins, boards, pin-queue)
      - name: Commit trackers
        if: steps.guard.outputs.ok == 'true'
        run: |
          git config user.name "PawHound Bot"
          git config user.email "bot@valuefindsdaily.com"
          git add content/posted-pins.json content/pinterest-boards.json content/pin-queue.json
          git diff --cached --quiet || git commit -m "Update pin trackers [skip netlify]"
          git pull --rebase --autostash || true
          git push
