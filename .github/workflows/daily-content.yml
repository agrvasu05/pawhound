name: Daily content generation

on:
  schedule:
    # 14:00 UTC = ~10 AM ET. GENERATION ONLY — builds + deploys articles during the
    # day so they're live well before the evening. POSTING happens separately in
    # post-pins.yml at 9 PM ET (triggered by cron-job.org), which is why the exact
    # firing time here doesn't matter (a GitHub cron delay is harmless for generation).
    - cron: '0 14 * * *'
  workflow_dispatch:      # manual trigger from GitHub Actions tab

permissions:
  contents: write
  id-token: write   # required for keyless Google Cloud auth (Workload Identity)

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Keyless auth to Google Cloud for Vertex AI (Gemini). No SA key file —
      # GitHub's OIDC token is exchanged for short-lived GCP credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: project-394cd8b9-b7dd-48a6-930
          workload_identity_provider: projects/1010009979038/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: vertex-gemini@project-394cd8b9-b7dd-48a6-930.iam.gserviceaccount.com

      - name: Install dependencies
        run: npm install

      # Refresh trending keywords from the Pinterest Trends API
      - name: Refresh trend briefs
        continue-on-error: true   # Pinterest auth hiccups must not stop article generation (we still have briefs on disk)
        run: node products/trends-engine.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: single-bonus-450611-h1   # Vertex billing project (WIF SA has aiplatform.user here)
          GEMINI_MODEL: gemini-2.5-flash
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      # Quality over volume (Oct 2026): Google judged the mass-produced guides low
      # value. New articles: ONE per week (Mondays). Every day: rewrite existing
      # guides into answer-first, data-grounded versions (scripts/upgrade-article.js);
      # only upgraded guides are indexable. Upgrades start 2026-10-24, after the
      # first hand-written batch of 10 has been measured in Search Console.
      - name: Generate this week's article (Mondays only)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "Not Monday — no new article today."; exit 0; fi
          node scripts/2d-generate-trend-articles.js --count=1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GCP_PROJECT_ID: single-bonus-450611-h1
          GEMINI_MODEL: gemini-2.5-flash

      - name: Upgrade existing guides (2/day)
        continue-on-error: true
        run: node scripts/upgrade-article.js --count=2
        env:
          UPGRADE_START: '2026-10-24'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_PROJECT_ID: single-bonus-450611-h1
          GEMINI_MODEL: gemini-2.5-flash

      - name: Fetch images for new articles
        run: node scripts/3-fetch-images.js
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # Deploy new articles so URLs + pin images are live long before the evening
      # posting run (post-pins.yml). No posting happens here.
      - name: Commit and push new content
        run: |
          git config user.name "PawHound Bot"
          git config user.email "bot@valuefindsdaily.com"
          # Pins are rendered at post time now (scripts/5-post-pins.js); only
          # article JSON + one Pexels photo per item get committed.
          git add content/ public/images/
          # [skip netlify] — don't build here. The daily-products run (15:00, one
          # hour later) is the single daily Netlify build and publishes this
          # content + the new products together. Halves build-minute usage so
          # Netlify's free tier doesn't run out mid-month and freeze the site.
          git diff --cached --quiet || git commit -m "Daily content"
          git pull --rebase --autostash || { node products/merge-queue.js && GIT_EDITOR=true git rebase --continue; }
          git push
