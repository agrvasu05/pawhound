name: Daily content generation

on:
  schedule:
    # 00:45 UTC: generation + ~5min deploy wait lands the PIN POSTING at ~9 PM ET
    # (= 6 PM PT) — Pinterest's US evening peak. (Shifts ~1h in winter/EST; still in peak.)
    - cron: '45 0 * * *'
  workflow_dispatch:      # manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Install dependencies
        run: npm install

      # Refresh trending keywords from the Pinterest Trends API
      - name: Refresh trend briefs
        run: node products/trends-engine.js
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}

      # Trends only — keyword-driven fashion/beauty/home articles (affiliate-ready).
      # (Dog + generic-home generators retired.)
      - name: Generate trending articles
        run: node scripts/2d-generate-trend-articles.js --count=6
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Fetch images for new articles
        run: node scripts/3-fetch-images.js
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Generate pin images
        run: node scripts/4-generate-pins.js
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      # Deploy new articles FIRST so URLs are live before Pinterest tries to crawl them
      - name: Commit and push new content
        run: |
          git config user.name "PawHound Bot"
          git config user.email "bot@valuefindsdaily.com"
          git add content/ public/
          git diff --cached --quiet || git commit -m "Daily content"
          git push

      # Wait for Netlify to finish deploying the new articles before Pinterest
      # tries to fetch their pin images. A full Next.js build of all pages takes
      # a few minutes; any pins whose images aren't live yet simply retry on the
      # next daily run (failed pins are not recorded as posted).
      - name: Wait for Netlify deploy
        run: sleep 300

      - name: Post pins to Pinterest
        id: pinterest
        run: node scripts/5-post-pins.js
        env:
          PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
          PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}

      - name: Rotate Pinterest refresh token
        if: steps.pinterest.outputs.new_refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.PINTEREST_PAT }}
        run: |
          gh secret set PINTEREST_REFRESH_TOKEN --body "${{ steps.pinterest.outputs.new_refresh_token }}" --repo ${{ github.repository }}

      # Save updated pin tracker (posted-pins.json + pinterest-boards.json)
      - name: Commit pin tracker
        run: |
          git add content/posted-pins.json content/pinterest-boards.json
          git diff --cached --quiet || git commit -m "Update pin tracker"
          git push
